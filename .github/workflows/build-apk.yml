name: Build Android APK - Ambalan La Surullah

on:
  workflow_dispatch:
  push:
    branches:
      - perbaikan-pdf

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.PETTALOPO_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.PETTALOPO_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.PETTALOPO_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.PETTALOPO_KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies and refresh bun.lock
        run: bun install

      - name: Commit resolved bun.lock on feature branch
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add bun.lock
            git commit -m "Update bun lockfile for PDF export"
            git push
          fi

      - name: TypeScript check
        run: bun run lint

      - name: Test PDF export with short and multi-page letters
        run: bun run test:pdf

      - name: Build Web Application
        run: bun run build

      - name: Create Android Project
        run: npx cap add android

      - name: Apply Pettalopo Mobile App Icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          source = Image.open("public/assets/pettalopo-logo.png").convert("RGBA")

          # Remove only a near-white background connected to the image edges.
          # White details enclosed inside the emblem remain untouched.
          corners = [(0, 0), (source.width - 1, 0), (0, source.height - 1), (source.width - 1, source.height - 1)]
          for point in corners:
              pixel = source.getpixel(point)
              if min(pixel[:3]) >= 238 and pixel[3] > 0:
                  ImageDraw.floodfill(source, point, (0, 0, 0, 0), thresh=28)

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          foreground_sizes = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}

          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)

              # Legacy launcher icons: transparent canvas, no white square.
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              logo = source.copy()
              logo.thumbnail((int(size * 0.82), int(size * 0.82)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size - logo.width) // 2, (size - logo.height) // 2))
              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)

              # Adaptive icon foreground remains transparent; Android applies brand-red
              # background as a proper adaptive layer rather than a white bitmap box.
              fg_size = foreground_sizes[density]
              foreground = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
              fg_logo = source.copy()
              fg_logo.thumbnail((int(fg_size * 0.68), int(fg_size * 0.68)), Image.Resampling.LANCZOS)
              foreground.alpha_composite(fg_logo, ((fg_size - fg_logo.width) // 2, (fg_size - fg_logo.height) // 2))
              foreground.save(folder / "ic_launcher_foreground.png", optimize=True)

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "pettalopo_colors.xml"
          colors.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="pettalopo_launcher_background">#00000000</color>
              <color name="pettalopo_splash_background">#E51C24</color>
          </resources>
          """)

          adaptive = Path("android/app/src/main/res/mipmap-anydpi-v26")
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/transparent" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          """
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Capacitor FileProvider paths for PDF opening
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
              <external-files-path name="external-files" path="." />
              <external-cache-path name="external-cache" path="." />
              <external-path name="pettalopo-documents" path="Documents/Pettalopo/" />
          </paths>
          XML

      - name: Keep Android system splash styling without Capacitor splash plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          if "androidx.core:core-splashscreen" not in content:
              match = re.search(r'dependencies\s*\{', content)
              if not match:
                  raise SystemExit("Gradle dependencies block not found.")
              content = content[:match.end()] + '\n    implementation "androidx.core:core-splashscreen:1.0.1"' + content[match.end():]
              gradle.write_text(content)

          candidates = [
              Path("android/app/src/main/java/id/sch/smpialwasi_maros/ambalan/MainActivity.java"),
              Path("android/app/src/main/java/id/sch/smpialwasi_maros/ambalan/MainActivity.kt")
          ]
          activity = next((p for p in candidates if p.exists()), None)
          if activity is None:
              matches = list(Path("android/app/src/main").rglob("MainActivity.*"))
              activity = matches[0] if matches else None
          if activity is None:
              raise SystemExit("Capacitor MainActivity not found.")
          source = activity.read_text()
          if activity.suffix == ".java":
              if "androidx.core.splashscreen.SplashScreen" not in source:
                  source = source.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport androidx.core.splashscreen.SplashScreen;")
              if "SplashScreen.installSplashScreen(this);" not in source:
                  source = source.replace("super.onCreate(savedInstanceState);", "SplashScreen.installSplashScreen(this);\n        super.onCreate(savedInstanceState);")
          else:
              if "androidx.core.splashscreen.SplashScreen" not in source:
                  source = source.replace("import com.getcapacitor.BridgeActivity", "import com.getcapacitor.BridgeActivity\nimport androidx.core.splashscreen.SplashScreen")
              if "SplashScreen.installSplashScreen(this)" not in source:
                  source = source.replace("super.onCreate(savedInstanceState)", "SplashScreen.installSplashScreen(this)\n        super.onCreate(savedInstanceState)")
          activity.write_text(source)
          print("Android system splash is configured independently of the Capacitor splash plugin.")
          PY

      - name: Configure Android APK installer access
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
              <external-files-path name="external-files" path="." />
              <external-cache-path name="external-cache" path="." />
          </paths>
          XML
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in content:
              content = content.replace("<manifest", "<manifest", 1)
              insert_at = content.find(">", content.find("<manifest")) + 1
              content = content[:insert_at] + "\\n" + permission + content[insert_at:]
          manifest.write_text(content)
          PY

      - name: Configure blank native launch layer for AI Studio splash handoff
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re

          resources = Path("android/app/src/main/res")
          values = resources / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "pettalopo_colors.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="pettalopo_splash_background">#E51C24</color></resources>
          """)

          # Capacitor's legacy splash resource is kept as a transparent image,
          # while the plugin/theme supplies the matching red background.
          drawable = resources / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          Image.new("RGBA", (1, 1), (0, 0, 0, 0)).save(drawable / "splash.png", optimize=True)

          # Capacitor generates separate portrait/landscape and density-qualified
          # splash.png files. Replace EVERY generated variant so an old logo cannot
          # reappear through Android resource selection.
          transparent_splash = Image.new("RGBA", (1, 1), (0, 0, 0, 0))
          replaced_splashes = []
          for splash_path in resources.rglob("splash.png"):
              transparent_splash.save(splash_path, optimize=True)
              replaced_splashes.append(str(splash_path))
          print("Replaced all Capacitor splash variants with transparent images:")
          for splash_path in replaced_splashes:
              print(" -", splash_path)
          if not replaced_splashes:
              raise SystemExit("No generated splash.png resources were found.")

          # Android 12+ requires a system splash, but its icon is transparent so
          # users see only the same red field before the original React splash.
          icon_dir = resources / "drawable-nodpi"
          icon_dir.mkdir(parents=True, exist_ok=True)
          Image.new("RGBA", (512, 512), (0, 0, 0, 0)).save(icon_dir / "pettalopo_splash_icon.png", optimize=True)

          styles = values / "styles.xml"
          content = styles.read_text()
          pattern = r'(<style name="AppTheme.NoActionBarLaunch"[^>]*>)(.*?)(</style>)'
          match = re.search(pattern, content, re.S)
          if not match:
              raise SystemExit("AppTheme.NoActionBarLaunch was not found.")
          opening, body, closing = match.groups()
          opening = re.sub(r'parent="[^"]+"', 'parent="Theme.SplashScreen"', opening, count=1)
          entries = [
              ("windowSplashScreenBackground", "@color/pettalopo_splash_background"),
              ("windowSplashScreenAnimatedIcon", "@drawable/pettalopo_splash_icon"),
              ("windowSplashScreenIconBackgroundColor", "@android:color/transparent"),
              ("postSplashScreenTheme", "@style/AppTheme.NoActionBar"),
              ("android:windowBackground", "@color/pettalopo_splash_background"),
              ("android:statusBarColor", "#FFFFFF"),
              ("android:windowLightStatusBar", "true"),
              ("android:navigationBarColor", "#FFFFFF"),
              ("android:windowLightNavigationBar", "true"),
              ("android:windowDrawsSystemBarBackgrounds", "true"),
              ("android:enforceNavigationBarContrast", "false")
          ]
          for name, value in entries:
              body = re.sub(r'<item\s+name="' + re.escape(name) + r'">.*?</item>', '', body, flags=re.S)
              body += "\n        <item name='" + name + "'>" + value + "</item>"
          content = content[:match.start()] + opening + body + closing + content[match.end():]
          # Set the same light system bars on the normal application theme,
          # not only on the temporary Android splash theme.
          normal = re.search(r'(<style name="AppTheme.NoActionBar"[^>]*>)(.*?)(</style>)', content, re.S)
          if not normal:
              raise SystemExit("AppTheme.NoActionBar was not found.")
          normal_open, normal_body, normal_close = normal.groups()
          system_entries = [
              ("android:statusBarColor", "#FFFFFF"),
              ("android:windowLightStatusBar", "true"),
              ("android:navigationBarColor", "#FFFFFF"),
              ("android:windowLightNavigationBar", "true"),
              ("android:windowDrawsSystemBarBackgrounds", "true"),
              ("android:enforceNavigationBarContrast", "false")
          ]
          for name, value in system_entries:
              normal_body = re.sub(r"<item\s+name=['\"]" + re.escape(name) + r"['\"]>.*?</item>", '', normal_body, flags=re.S)
              normal_body += "\n        <item name='" + name + "'>" + value + "</item>"
          content = content[:normal.start()] + normal_open + normal_body + normal_close + content[normal.end():]
          styles.write_text(content)

          v31 = resources / "values-v31"
          v31.mkdir(parents=True, exist_ok=True)
          v31_body = "\n".join("        <item name='" + name + "'>" + value + "</item>" for name, value in entries if name != "android:windowBackground")
          (v31 / "styles.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n'
              + v31_body + '\n    </style>\n</resources>\n'
          )
          print("Native launch layer is blank and red; original React splash is retained as the only branded splash.")
          PY

      - name: Read app version
        id: version
        run: |
          node -e 'const p = require("./package.json"); console.log("version=" + p.version)' >> "$GITHUB_OUTPUT"

      - name: Set Android app version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path("package.json").read_text())
          version = package["version"]
          version_code = int(package["androidVersionCode"])
          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          import re
          content, count_code = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', content, count=1)
          content, count_name = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version}"', content, count=1)
          if count_code != 1 or count_name != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")
          gradle.write_text(content)
          PY

      - name: Configure permanent APK signing
        id: signing
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets are not configured."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/pettalopo-release.jks
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "android {"
          if marker not in s:
              raise SystemExit("Android Gradle configuration not found")
          signing = """
              signingConfigs {
                  release {
                      storeFile file("pettalopo-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """
          s = s.replace(marker, marker + signing, 1)
          s = s.replace('buildTypes {', 'buildTypes {\n        release { signingConfig signingConfigs.release }', 1)
          p.write_text(s)
          PY

      - name: Build Release APK
        if: steps.signing.outcome == 'success'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK (fallback when permanent signing is not configured)
        if: steps.signing.outcome == 'skipped'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publish GitHub Release
        if: steps.signing.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pettalopo Mobile v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pettalopo-Mobile-v${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
