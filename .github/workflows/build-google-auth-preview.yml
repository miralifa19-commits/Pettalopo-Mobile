name: Preview Google Authentication - Pettalopo Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - feature/google-auth-profile
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - ".github/workflows/build-google-auth-preview.yml"

permissions:
  contents: read

jobs:
  build-preview:
    name: Typecheck and build Android Google Auth preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/google-auth-profile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies and update Bun lock
        run: bun install

      - name: TypeScript check
        run: bun run lint

      - name: Build web application
        run: bun run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure Firebase Android app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GitHub Secret GOOGLE_SERVICES_JSON belum tersedia. Isi dengan Base64 google-services.json Android dari Firebase Console."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("android/app/google-services.json")
          data = json.loads(p.read_text())
          if not data.get("project_info") or not data.get("client"):
              raise SystemExit("google-services.json tidak valid.")
          if data["project_info"].get("project_id") != "pettalopo-6f6f4":
              raise SystemExit("google-services.json bukan untuk Firebase project Pettalopo Mobile yang baru.")
          package_names = [item.get("client_info", {}).get("android_client_info", {}).get("package_name") for item in data["client"]]
          if "id.sch.smpialwasi_maros.ambalan" not in package_names:
              raise SystemExit("google-services.json tidak memuat package id Pettalopo Mobile.")
          p = Path("android/variables.gradle")
          lines = p.read_text().splitlines()
          for key, value in {
              "rgcfaIncludeGoogle": "true",
              "androidxCredentialsVersion": "'1.3.0'"
          }.items():
              found = False
              for index, line in enumerate(lines):
                  if line.strip().startswith(key + " ="):
                      lines[index] = f"    {key} = {value}"
                      found = True
                      break
              if not found:
                  ext_index = next((i for i, line in enumerate(lines) if line.strip() == "ext {"), None)
                  if ext_index is None:
                      raise SystemExit("Blok ext tidak ditemukan di variables.gradle.")
                  lines.insert(ext_index + 1, f"    {key} = {value}")
          p.write_text("\n".join(lines) + "\n")
          print("Firebase Android config siap; rahasia tidak dicetak.")
          PY

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Pettalopo-Google-Auth-preview-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
