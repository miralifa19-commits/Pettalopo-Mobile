name: Pasang Login Google - Pettalopo Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - fix/member-google-auth

permissions:
  contents: write

concurrency:
  group: pasang-login-google-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-build:
    name: Pasang plugin dan build APK debug
    if: github.ref == 'refs/heads/fix/member-google-auth'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cabang login Google
        uses: actions/checkout@v4
        with:
          ref: fix/member-google-auth
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pasang Bun
        uses: oven-sh/setup-bun@v2

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Pasang Android platform dan build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Pasang dependensi aplikasi
        run: |
          bun install
          bun add @capacitor-firebase/authentication@8.6.0
          if ! node -e "require('./package.json').dependencies?.firebase"; then
            bun add firebase@^13.1.0
          fi

      - name: Commit package.json dan bun.lock ke cabang yang sama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "Install Capacitor Firebase Google Authentication"
            git push origin HEAD:fix/member-google-auth
          else
            echo "package.json dan bun.lock tidak berubah."
          fi

      - name: Build web sebelum sinkronisasi Android
        run: bun run build

      - name: Buat project Android bila belum tersedia
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Siapkan google-services.json dari GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GitHub Secret GOOGLE_SERVICES_JSON belum dibuat. Isi dengan Base64 dari google-services.json Firebase untuk aplikasi Android ini."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("android/app/google-services.json")
          data = json.loads(p.read_text())
          if not data.get("project_info") or not data.get("client"):
              raise SystemExit("GOOGLE_SERVICES_JSON bukan berkas konfigurasi Firebase Android yang valid.")
          print("google-services.json berhasil dibuat dari GitHub Secret; isi rahasia tidak ditampilkan.")
          PY

      - name: Aktifkan dukungan Google di plugin Android
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/variables.gradle")
          if not p.exists():
              raise SystemExit("android/variables.gradle tidak ditemukan setelah project Android dibuat.")
          s = p.read_text()
          settings = {
              "rgcfaIncludeGoogle": "true",
              "androidxCredentialsVersion": "'1.3.0'"
          }
          for key, value in settings.items():
              import re
              pattern = r"(?m)^\\s*" + re.escape(key) + r"\\s*=.*$"
              line = f"    {key} = {value}"
              if re.search(pattern, s):
                  s = re.sub(pattern, line, s, count=1)
              else:
                  marker = "ext {"
                  if marker not in s:
                      raise SystemExit("Blok ext { tidak ditemukan di android/variables.gradle.")
                  s = s.replace(marker, marker + "\\n" + line, 1)
          p.write_text(s)
          print("rgcfaIncludeGoogle = true sudah diterapkan.")
          PY

      - name: Sinkronkan plugin Capacitor ke Android
        run: npx cap sync android

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Cetak SHA-1 dan SHA-256 sertifikat APK debug
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "========== SHA-1 SERTIFIKAT APK DEBUG =========="
          apksigner verify --print-certs "$APK" | grep -E 'certificate SHA-1 digest|Signer #1 certificate SHA-1 digest' || true
          echo "========== SHA-256 SERTIFIKAT APK DEBUG =========="
          apksigner verify --print-certs "$APK" | grep -E 'certificate SHA-256 digest|Signer #1 certificate SHA-256 digest' || true
          echo "CATATAN: ini sertifikat debug. Untuk APK rilis, SHA-1/SHA-256 harus diambil dari APK yang ditandatangani keystore rilis Pettalopo."

      - name: Unggah APK debug sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pettalopo-Login-Google-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
