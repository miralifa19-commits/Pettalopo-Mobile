name: Build Pettalopo Android APK (Debug)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-debug-apk.yml"
      - "src/**"
      - "public/**"
      - "pettalopo-logo.png"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: bun install

      - name: Build web application
        run: bun run build

      - name: Create Android project
        run: bunx cap add android

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Configure app version and Android 12 splash screen
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from PIL import Image

          package = json.loads(Path("package.json").read_text())
          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          content = re.sub(r'versionCode\s+\d+', f'versionCode {package.get("androidVersionCode", 7)}', content, count=1)
          content = re.sub(r'versionName\s+"[^"]+"', f'versionName "{package["version"]}"', content, count=1)
          gradle.write_text(content)

          resources = Path("android/app/src/main/res")
          drawable = resources / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          Image.new("RGBA", (1, 1), (0, 0, 0, 0)).save(drawable / "transparent_splash.png")

          values_v31 = resources / "values-v31"
          values_v31.mkdir(parents=True, exist_ok=True)
          styles = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#E51C24</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/transparent_splash</item>
                  <item name="windowSplashScreenIconBackgroundColor">@android:color/transparent</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          """
          (values_v31 / "styles.xml").write_text(styles)
          PY

      - name: Apply uploaded Pettalopo launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          source = Image.open("pettalopo-logo.png").convert("RGBA")
          android = Path("android/app/src/main/res")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = android / folder
              target.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              logo = ImageOps.contain(source, (int(size * 0.88), int(size * 0.88)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size - logo.width) // 2, (size - logo.height) // 2))
              canvas.save(target / "ic_launcher.png")
              canvas.save(target / "ic_launcher_round.png")

          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          logo = ImageOps.contain(source, (340, 340), Image.Resampling.LANCZOS)
          foreground.alpha_composite(logo, ((432 - logo.width) // 2, (432 - logo.height) // 2))
          drawable = android / "drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          foreground.save(drawable / "ic_launcher_foreground.png")

          adaptive = android / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@android:color/transparent" />\n    <foreground android:drawable="@drawable/ic_launcher_foreground" />\n</adaptive-icon>\n'''
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pettalopo-Mobile-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
