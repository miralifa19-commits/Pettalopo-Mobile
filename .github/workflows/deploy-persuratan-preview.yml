name: Deploy Pratinjau Persuratan Terpisah

on:
  push:
    branches:
      - fix/persuratan-signature-cap-tembusan
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main sebagai situs utama
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout branch persuratan
        uses: actions/checkout@v4
        with:
          ref: fix/persuratan-signature-cap-tembusan
          path: preview-src
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build situs utama dari main
        working-directory: site
        run: |
          bun install
          bun run lint
          bun run test:pdf
          bun run build
        env:
          GITHUB_PAGES: 'true'
      - name: Build pratinjau branch persuratan
        working-directory: preview-src
        run: |
          bun install
          bun run lint
          bun run test:pdf
          bun run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE: '/Pettalopo-Mobile/preview/persuratan/'
      - name: Gabungkan situs utama dan pratinjau branch
        run: |
          mkdir -p site/dist/preview/persuratan
          cp -R preview-src/dist/. site/dist/preview/persuratan/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy situs utama beserta pratinjau terpisah
        id: deployment
        uses: actions/deploy-pages@v4
