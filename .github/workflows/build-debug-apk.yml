name: Build Pettalopo Android APK (Debug)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-debug-apk.yml"
      - "src/**"
      - "public/**"
      - "pettalopo-logo.png"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Test PDF export with original letterhead and multi-page text
        run: npm run test:pdf

      - name: Build web application
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Keep Android system splash styling without Capacitor splash plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          if "androidx.core:core-splashscreen" not in content:
              match = re.search(r'dependencies\s*\{', content)
              if not match:
                  raise SystemExit("Gradle dependencies block not found.")
              content = content[:match.end()] + '\n    implementation "androidx.core:core-splashscreen:1.0.1"' + content[match.end():]
              gradle.write_text(content)

          candidates = [
              Path("android/app/src/main/java/id/sch/smpialwasi_maros/ambalan/MainActivity.java"),
              Path("android/app/src/main/java/id/sch/smpialwasi_maros/ambalan/MainActivity.kt")
          ]
          activity = next((p for p in candidates if p.exists()), None)
          if activity is None:
              matches = list(Path("android/app/src/main").rglob("MainActivity.*"))
              activity = matches[0] if matches else None
          if activity is None:
              raise SystemExit("Capacitor MainActivity not found.")
          source = activity.read_text()
          if activity.suffix == ".java":
              if "androidx.core.splashscreen.SplashScreen" not in source:
                  source = source.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport androidx.core.splashscreen.SplashScreen;")
              if "SplashScreen.installSplashScreen(this);" not in source:
                  source = source.replace("super.onCreate(savedInstanceState);", "SplashScreen.installSplashScreen(this);\n        super.onCreate(savedInstanceState);")
          else:
              if "androidx.core.splashscreen.SplashScreen" not in source:
                  source = source.replace("import com.getcapacitor.BridgeActivity", "import com.getcapacitor.BridgeActivity\nimport androidx.core.splashscreen.SplashScreen")
              if "SplashScreen.installSplashScreen(this)" not in source:
                  source = source.replace("super.onCreate(savedInstanceState)", "SplashScreen.installSplashScreen(this)\n        super.onCreate(savedInstanceState)")
          activity.write_text(source)
          print("Android system splash is configured independently of the Capacitor splash plugin.")
          PY

      - name: Configure version, transparent launcher icon, and unified splash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          package = json.loads(Path("package.json").read_text())
          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          version_name = package["version"]
          version_code = int(package["androidVersionCode"])
          expected_code = int(version_name.rsplit(".", 1)[-1])
          if version_code != expected_code:
              raise SystemExit(
                  f"Version mismatch: versionName={version_name}, "
                  f"androidVersionCode={version_code}; expected {expected_code}."
              )
          content, code_count = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', content, count=1)
          content, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely update both Android version fields.")
          gradle.write_text(content)
          print(f"Android version verified: {version_name} (versionCode {version_code}).")

          source = Image.open("public/assets/pettalopo-logo.png").convert("RGBA")
          if source.getchannel("A").getextrema()[0] == 255:
              corners = [(0, 0), (source.width - 1, 0), (0, source.height - 1), (source.width - 1, source.height - 1)]
              for point in corners:
                  pixel = source.getpixel(point)
                  if min(pixel[:3]) >= 238:
                      ImageDraw.floodfill(source, point, (0, 0, 0, 0), thresh=28)
          bounds = source.getbbox()
          if not bounds:
              raise SystemExit("Official app logo is empty.")
          source = source.crop(bounds)

          resources = Path("android/app/src/main/res")
          colors = resources / "values/pettalopo_colors.xml"
          colors.parent.mkdir(parents=True, exist_ok=True)
          colors.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="pettalopo_splash_background">#E51C24</color>
          </resources>
          """)

          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, size in sizes.items():
              target = resources / folder
              target.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              logo = ImageOps.contain(source, (int(size * 0.82), int(size * 0.82)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size - logo.width) // 2, (size - logo.height) // 2))
              canvas.save(target / "ic_launcher.png", optimize=True)
              canvas.save(target / "ic_launcher_round.png", optimize=True)
              fg_size = size * 2.25
              foreground = Image.new("RGBA", (int(fg_size), int(fg_size)), (0, 0, 0, 0))
              fg_logo = ImageOps.contain(source, (int(fg_size * 0.66), int(fg_size * 0.66)), Image.Resampling.LANCZOS)
              foreground.alpha_composite(fg_logo, ((foreground.width - fg_logo.width) // 2, (foreground.height - fg_logo.height) // 2))
              foreground.save(target / "ic_launcher_foreground.png", optimize=True)

          adaptive = resources / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/transparent" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          """
          (adaptive / "ic_launcher.xml").write_text(adaptive_xml)
          (adaptive / "ic_launcher_round.xml").write_text(adaptive_xml)

          # Android 12+ native splash: reuse the same official logo and red background as the React splash.
          # The native system splash supports a centered icon and solid background; the React splash retains its text/shimmer.
          icon = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          splash_logo = ImageOps.contain(source, (384, 384), Image.Resampling.LANCZOS)
          icon.alpha_composite(splash_logo, ((512 - splash_logo.width) // 2, (512 - splash_logo.height) // 2))
          drawable_nodpi = resources / "drawable-nodpi"
          drawable_nodpi.mkdir(parents=True, exist_ok=True)
          icon.save(drawable_nodpi / "pettalopo_splash_icon.png", optimize=True)
          icon.save(drawable_nodpi / "ic_launcher_foreground.png", optimize=True)

          legacy_splash = Image.new("RGBA", (2732, 2732), (0, 0, 0, 0))
          drawable = resources / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          legacy_splash.save(drawable / "splash.png", optimize=True)

          # Capacitor generates separate portrait/landscape and density-qualified
          # splash.png files. Replace EVERY generated variant so an old logo cannot
          # reappear through Android resource selection.
          transparent_splash = Image.new("RGBA", (1, 1), (0, 0, 0, 0))
          replaced_splashes = []
          for splash_path in resources.rglob("splash.png"):
              transparent_splash.save(splash_path, optimize=True)
              replaced_splashes.append(str(splash_path))
          print("Replaced all Capacitor splash variants with transparent images:")
          for splash_path in replaced_splashes:
              print(" -", splash_path)
          if not replaced_splashes:
              raise SystemExit("No generated splash.png resources were found.")

          entries = [
              ("windowSplashScreenBackground", "@color/pettalopo_splash_background"),
              ("windowSplashScreenAnimatedIcon", "@drawable/pettalopo_splash_icon"),
              ("windowSplashScreenIconBackgroundColor", "@android:color/transparent"),
              ("postSplashScreenTheme", "@style/AppTheme.NoActionBar"),
              ("android:windowBackground", "@color/pettalopo_splash_background")
          ]
          values = resources / "values"
          values.mkdir(parents=True, exist_ok=True)
          styles_path = values / "styles.xml"
          styles_content = styles_path.read_text()
          pattern = r'(<style name="AppTheme.NoActionBarLaunch"[^>]*>)(.*?)(</style>)'
          match = re.search(pattern, styles_content, re.S)
          if not match:
              raise SystemExit("AppTheme.NoActionBarLaunch was not found in styles.xml.")
          opening, body, closing = match.groups()
          opening = re.sub(r'parent="[^"]+"', 'parent="Theme.SplashScreen"', opening, count=1)
          for name, value in entries:
              body = re.sub(r'<item\s+name="' + re.escape(name) + r'">.*?</item>', '', body, flags=re.S)
              body += "\n        <item name='" + name + "'>" + value + "</item>"
          styles_path.write_text(styles_content[:match.start()] + opening + body + closing + styles_content[match.end():])

          values_v31 = resources / "values-v31"
          values_v31.mkdir(parents=True, exist_ok=True)
          v31_body = "\n".join("        <item name='" + name + "'>" + value + "</item>" for name, value in entries)
          v31_styles = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n'
              + v31_body + '\n'
              '    </style>\n'
              '</resources>\n'
          )
          (values_v31 / "styles.xml").write_text(v31_styles)
          print("Transparent launcher icons and branded Android 12+ splash generated with the official Pettalopo logo on #E51C24; React splash remains unchanged.")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pettalopo-Mobile-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
