name: Deploy Pettalopo GitHub Pages Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main source once
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: bun run lint

      - name: Test PDF export
        run: bun run test:pdf

      - name: Build the existing app for the root page
        env:
          GITHUB_PAGES: 'true'
        run: |
          bun run build
          mkdir -p site
          cp -R dist/. site/

      - name: Build the preview under /preview/
        env:
          VITE_BASE_PATH: /Pettalopo-Mobile/preview/
        run: |
          bun run build
          mkdir -p site/preview
          cp -R dist/. site/preview/
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview and preserve the current root app
        id: deployment
        uses: actions/deploy-pages@v4
